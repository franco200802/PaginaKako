<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Importaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <h1>🌎 Mis Compras Internacionales</h1>
        <div class="global-config">
            <label for="cotizacion">Cotización Dólar (ARS):</label>
            <input type="number" id="cotizacion" value="1440" step="10">
        </div>
    </div>

    <!-- Contenedor donde se agregarán las diferentes compras -->
    <div id="compras-container"></div>

    <div class="actions-container">
        <button id="btn-nueva-compra" class="btn-primary">+ Crear Nueva Lista de Compra</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
